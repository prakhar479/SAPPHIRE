<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPPHIRE | Audio Embedding Demo</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap"
    rel="stylesheet">
</head>

<body>
  <div class="container">
    <header>
      <img src="/static/logo.svg" alt="SAPPHIRE" class="logo" />
      <div>
        <h1>SAPPHIRE</h1>
        <p class="subtitle">Audio Embedding & Similarity Search Demo</p>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 16px;">
        <a href="/model_details" class="btn btn-ghost" style="text-decoration: none;">Model Details</a>
        <div id="statusBadges" class="controls" style="justify-content: flex-end; margin: 0;">
          <span id="indexStatus" class="badge">Index: Checking...</span>
          <span id="embedderStatus" class="badge">Embedder: Checking...</span>
        </div>
      </div>
    </header>

    <main>
      <!-- Search Section -->
      <div class="card">
        <h2 class="section-title">Search Similar Audio</h2>
        <div class="controls">
          <div style="flex: 1;">
            <input id="songId" type="number" placeholder="Enter Song ID..."
              style="width: 100%; box-sizing: border-box;">
          </div>
          <div style="width: 100px;">
            <input id="k" type="number" value="10" min="1" max="100" title="Number of results">
          </div>
          <button id="searchBtn" class="btn btn-primary">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            Search
          </button>
        </div>
      </div>

      <!-- Upload Section -->
      <div class="card">
        <h2 class="section-title">Upload & Analyze</h2>
        <form id="uploadForm">
          <div id="uploadDrop" class="upload-area">
            <input type="file" id="audioFile" name="file" accept="audio/*" class="hidden" />
            <div id="dropText">
              <svg width="32" height="32" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                style="margin-bottom: 8px; color: var(--primary);">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
              <p style="margin: 0; font-weight: 500;">Click to upload or drag and drop</p>
              <p style="margin: 4px 0 0 0; font-size: 13px; color: var(--text-muted);">MP3, WAV, OGG supported</p>
            </div>
            <div id="filePreview" class="hidden"
              style="display: flex; align-items: center; justify-content: center; gap: 8px;">
              <span id="fileName" style="font-weight: 500;"></span>
              <button type="button" id="clearFile" class="btn btn-ghost"
                style="padding: 4px 8px; font-size: 12px;">Change</button>
            </div>
          </div>
          <div class="controls" style="margin-top: 16px; justify-content: flex-end;">
            <button type="submit" class="btn btn-primary" id="uploadBtn" disabled>Analyze Upload</button>
          </div>
        </form>
      </div>

      <!-- Results Section -->
      <div id="resultsArea" class="hidden">
        <div class="card">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h2 class="section-title" style="margin: 0;">Results</h2>
            <button id="clearResults" class="btn btn-ghost" style="font-size: 12px; padding: 6px 12px;">Clear</button>
          </div>
          <div id="results" class="results-grid"></div>
        </div>
      </div>

      <!-- Library Section -->
      <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <h2 class="section-title" style="margin: 0;">Library</h2>
          <div class="controls">
            <button id="buildIndex" class="btn btn-ghost">Rebuild Index</button>
          </div>
        </div>

        <div class="controls" style="margin-bottom: 16px;">
          <input id="libFilter" type="text" placeholder="Filter library..." style="flex: 1;">
          <select id="libPageSize" style="width: auto;">
            <option value="10">10 per page</option>
            <option value="25">25 per page</option>
            <option value="50">50 per page</option>
          </select>
        </div>

        <div id="library" class="table-container">
          <div id="libraryPreview">Loading library...</div>
        </div>

        <div class="controls" style="margin-top: 16px; justify-content: center;">
          <button id="libPrev" class="btn btn-ghost" disabled>Previous</button>
          <span id="libPageInfo" style="font-size: 14px; color: var(--text-muted);">Page 1</span>
          <button id="libNext" class="btn btn-ghost" disabled>Next</button>
        </div>

        <!-- Hidden metadata storage -->
        {% if metadata %}
        <script id="metaJson" type="application/json">{{ metadata|tojson }}</script>
        {% endif %}
      </div>

      <!-- Debug/Log Section -->
      <div style="margin-top: 40px;">
        <button id="toggleLog" class="btn btn-ghost" style="width: 100%;">Show System Log</button>
        <div id="processLog" class="log-container hidden">
          <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
            <strong>System Log</strong>
            <button id="clearLog"
              style="background: none; border: none; color: #94a3b8; cursor: pointer;">Clear</button>
          </div>
          <div id="logEntries"></div>
        </div>
      </div>
    </main>
  </div>

  <script>
    // --- Utilities ---
    const $ = (id) => document.getElementById(id);
    const ts = () => new Date().toLocaleTimeString();

    function log(msg, type = 'info') {
      const el = document.createElement('div');
      el.className = 'log-entry';
      el.innerHTML = `<span style="color: #64748b;">[${ts()}]</span> ${msg}`;
      $('logEntries').appendChild(el);
      $('logEntries').scrollTop = $('logEntries').scrollHeight;
    }

    function setBusy(btn, isBusy, label = 'Working...') {
      if (!btn) return;
      btn.disabled = isBusy;
      const originalLabel = btn.getAttribute('data-original-label') || btn.innerHTML;
      if (isBusy) {
        if (!btn.getAttribute('data-original-label')) btn.setAttribute('data-original-label', btn.innerHTML);
        btn.innerHTML = `<span class="spin">↻</span> ${label}`;
      } else {
        btn.innerHTML = originalLabel;
      }
    }

    // --- Status & Health ---
    async function checkHealth() {
      try {
        const r = await fetch('/api/health');
        const data = await r.json();

        const idx = $('indexStatus');
        const emb = $('embedderStatus');

        if (data.ok) {
          idx.textContent = data.index_built ? 'Index Ready' : 'Index Missing';
          idx.className = `badge ${data.index_built ? 'success' : 'error'}`;

          emb.textContent = data.embedder_checkpoint_present ? 'Embedder Ready' : 'Embedder Missing';
          emb.className = `badge ${data.embedder_checkpoint_present ? 'success' : 'error'}`;

          log(`Health check: Index=${data.index_built}, Embedder=${data.embedder_checkpoint_present}`);
        }
      } catch (e) {
        console.error(e);
        log('Health check failed', 'error');
      }
    }

    // --- Search ---
    $('searchBtn').addEventListener('click', async () => {
      const id = $('songId').value;
      const k = $('k').value;

      if (!id) return;

      setBusy($('searchBtn'), true, 'Searching...');
      $('resultsArea').classList.remove('hidden');
      $('results').innerHTML = '<div style="text-align:center; padding: 20px;">Searching...</div>';

      try {
        const r = await fetch('/api/search', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ song_id: parseInt(id), k: parseInt(k) })
        });
        const data = await r.json();

        if (data.ok) {
          renderResults(data.results);
          log(`Search for ID ${id} returned ${data.results.length} results`);
        } else {
          $('results').innerHTML = `<div style="color: var(--error); text-align: center;">Error: ${data.error}</div>`;
        }
      } catch (e) {
        $('results').innerHTML = `<div style="color: var(--error); text-align: center;">Search failed: ${e}</div>`;
      } finally {
        setBusy($('searchBtn'), false);
      }
    });

    function renderResults(results) {
      const container = $('results');
      container.innerHTML = '';

      if (results.length === 0) {
        container.innerHTML = '<div style="text-align:center; color: var(--text-muted);">No results found</div>';
        return;
      }

      results.forEach(item => {
        const el = document.createElement('div');
        el.className = 'result-item';

        // Format info nicely
        const info = item.info || {};
        const title = info.track_id || `Song ${item.id}`;
        const details = Object.entries(info)
          .filter(([k]) => k !== 'track_id')
          .map(([k, v]) => `<span class="badge" style="margin-right: 4px;">${k}: ${v}</span>`)
          .join('');

        el.innerHTML = `
                    <div class="result-info">
                        <div style="font-weight: 600;">${title}</div>
                        <div class="result-meta">ID: ${item.id}</div>
                        <div style="margin-top: 8px;">${details}</div>
                        ${info.preview_url ? `<audio controls src="${info.preview_url}" style="margin-top: 8px; height: 32px; width: 100%;"></audio>` : ''}
                    </div>
                    <div class="result-score">
                        <div>${(1 - item.distance).toFixed(4)}</div>
                        <div style="font-size: 11px; color: var(--text-muted); font-weight: 400;">Similarity</div>
                    </div>
                `;
        container.appendChild(el);
      });
    }

    $('clearResults').addEventListener('click', () => {
      $('resultsArea').classList.add('hidden');
      $('results').innerHTML = '';
      $('songId').value = '';
      const analysisSection = document.getElementById('analysisSection');
      if (analysisSection) analysisSection.remove();
    });

    // --- Upload ---
    const dropZone = $('uploadDrop');
    const fileInput = $('audioFile');

    dropZone.addEventListener('click', () => fileInput.click());

    ['dragenter', 'dragover'].forEach(e => {
      dropZone.addEventListener(e, (ev) => {
        ev.preventDefault();
        dropZone.classList.add('dragover');
      });
    });

    ['dragleave', 'drop'].forEach(e => {
      dropZone.addEventListener(e, (ev) => {
        ev.preventDefault();
        dropZone.classList.remove('dragover');
      });
    });

    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) handleFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function handleFile(file) {
      $('dropText').classList.add('hidden');
      $('filePreview').classList.remove('hidden');
      $('filePreview').style.display = 'flex';
      $('fileName').textContent = file.name;
      $('uploadBtn').disabled = false;
    }

    $('clearFile').addEventListener('click', (e) => {
      e.stopPropagation();
      fileInput.value = '';
      $('dropText').classList.remove('hidden');
      $('filePreview').classList.add('hidden');
      $('uploadBtn').disabled = true;
    });

    $('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      setBusy($('uploadBtn'), true, 'Analyzing...');
      $('resultsArea').classList.remove('hidden');
      $('results').innerHTML = '<div style="text-align:center; padding: 20px;">Uploading and analyzing...</div>';

      const formData = new FormData();
      formData.append('file', file);
      formData.append('k', $('k').value);

      try {
        const r = await fetch('/api/upload', {
          method: 'POST',
          body: formData
        });
        const data = await r.json();

        if (data.ok) {
          renderResults(data.results);
          if (data.analysis) renderAnalysis(data.analysis);
          log(`Upload analysis complete. Found ${data.results.length} matches.`);
        } else {
          $('results').innerHTML = `<div style="color: var(--error); text-align: center;">Error: ${data.error}</div>`;
        }
      } catch (e) {
        $('results').innerHTML = `<div style="color: var(--error); text-align: center;">Upload failed: ${e}</div>`;
      } finally {
        setBusy($('uploadBtn'), false);
      }
    });

    // --- Library ---
    // Simple client-side pagination for demo
    let libraryData = [];
    let currentPage = 1;
    let pageSize = 10;

    function initLibrary() {
      try {
        const raw = $('metaJson')?.textContent;
        if (raw) {
          const data = JSON.parse(raw);
          // Convert object to array if needed
          if (!Array.isArray(data)) {
            libraryData = Object.entries(data).map(([k, v]) => ({ id: k, ...v }));
          } else {
            libraryData = data;
          }
          renderLibrary();
        } else {
          $('libraryPreview').innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No library metadata available.</div>';
        }
      } catch (e) {
        console.error(e);
        $('libraryPreview').textContent = 'Error loading library.';
      }
    }

    function renderLibrary() {
      const filter = $('libFilter').value.toLowerCase();
      const filtered = libraryData.filter(item => {
        if (!filter) return true;
        return Object.values(item).some(val => String(val).toLowerCase().includes(filter));
      });

      const total = filtered.length;
      const maxPage = Math.ceil(total / pageSize) || 1;
      if (currentPage > maxPage) currentPage = maxPage;

      const start = (currentPage - 1) * pageSize;
      const pageItems = filtered.slice(start, start + pageSize);

      $('libPageInfo').textContent = `Page ${currentPage} of ${maxPage} (${total} items)`;
      $('libPrev').disabled = currentPage <= 1;
      $('libNext').disabled = currentPage >= maxPage;

      if (pageItems.length === 0) {
        $('libraryPreview').innerHTML = '<div style="padding: 20px; text-align: center; color: var(--text-muted);">No items match filter.</div>';
        return;
      }

      // Dynamic columns
      const keys = Object.keys(pageItems[0]).slice(0, 5); // Limit columns

      let html = '<table><thead><tr>';
      keys.forEach(k => html += `<th>${k}</th>`);
      html += '<th>Action</th></tr></thead><tbody>';

      pageItems.forEach(item => {
        html += '<tr>';
        keys.forEach(k => html += `<td>${item[k] !== undefined ? item[k] : ''}</td>`);
        html += `<td><button class="btn btn-ghost" style="padding: 4px 8px; font-size: 12px;" onclick="copyId('${item.id}')">Copy ID</button></td></tr>`;
      });
      html += '</tbody></table>';

      $('libraryPreview').innerHTML = html;
    }

    window.copyId = (id) => {
      $('songId').value = id;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      // Highlight the input
      $('songId').focus();
      $('songId').style.borderColor = 'var(--primary)';
      setTimeout(() => $('songId').style.borderColor = '', 1000);
    };

    $('libFilter').addEventListener('input', () => { currentPage = 1; renderLibrary(); });
    $('libPageSize').addEventListener('change', (e) => { pageSize = parseInt(e.target.value); currentPage = 1; renderLibrary(); });
    $('libPrev').addEventListener('click', () => { if (currentPage > 1) { currentPage--; renderLibrary(); } });
    $('libNext').addEventListener('click', () => { currentPage++; renderLibrary(); });

    $('buildIndex').addEventListener('click', async () => {
      if (!confirm('Rebuild index? This may take a moment.')) return;
      setBusy($('buildIndex'), true, 'Building...');
      try {
        const r = await fetch('/api/index', { method: 'POST' });
        const d = await r.json();
        if (d.ok) {
          log(`Index built with ${d.items_indexed} items`);
          checkHealth();
        } else {
          log('Index build failed: ' + d.error, 'error');
        }
      } catch (e) {
        log('Index build error: ' + e, 'error');
      } finally {
        setBusy($('buildIndex'), false);
      }
    });

    // --- Log ---
    $('toggleLog').addEventListener('click', () => {
      $('processLog').classList.toggle('hidden');
      $('toggleLog').textContent = $('processLog').classList.contains('hidden') ? 'Show System Log' : 'Hide System Log';
    });
    $('clearLog').addEventListener('click', () => $('logEntries').innerHTML = '');

    // --- Live Analysis Visualization ---
    function renderAnalysis(data) {
      // Create analysis section if not exists
      let analysisSection = document.getElementById('analysisSection');
      if (!analysisSection) {
        analysisSection = document.createElement('div');
        analysisSection.id = 'analysisSection';
        analysisSection.className = 'card';
        analysisSection.style.marginTop = '24px';
        $('resultsArea').appendChild(analysisSection);
      }

      analysisSection.innerHTML = `
                <h2 class="section-title">Live Audio Analysis</h2>
                <div style="display: grid; gap: 24px;">
                    <div>
                        <h3 style="font-size: 14px; margin: 0 0 12px 0; color: var(--text-muted);">MFCC Features</h3>
                        <div id="mfccViz" style="height: 200px; background: var(--background); border-radius: 8px; padding: 16px; overflow: hidden;">
                            <canvas id="mfccCanvas" style="width: 100%; height: 100%;"></canvas>
                        </div>
                    </div>
                    <div>
                        <h3 style="font-size: 14px; margin: 0 0 12px 0; color: var(--text-muted);">Chroma Features</h3>
                        <div id="chromaViz" style="height: 150px; background: var(--background); border-radius: 8px; padding: 16px;">
                            <canvas id="chromaCanvas" style="width: 100%; height: 100%;"></canvas>
                        </div>
                    </div>
                </div>
            `;

      // Draw MFCC heatmap
      drawHeatmap('mfccCanvas', data.mfcc, 'Blues');
      drawHeatmap('chromaCanvas', data.chroma, 'Greens');
    }

    function drawHeatmap(canvasId, data, colorScheme) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const ctx = canvas.getContext('2d');
      const width = canvas.width = canvas.offsetWidth;
      const height = canvas.height = canvas.offsetHeight;

      if (!data || data.length === 0) return;

      const rows = data.length;
      const cols = data[0].length;
      const cellWidth = width / cols;
      const cellHeight = height / rows;

      // Find min/max for normalization
      let min = Infinity, max = -Infinity;
      data.forEach(row => row.forEach(val => {
        if (val < min) min = val;
        if (val > max) max = val;
      }));

      // Draw cells
      for (let i = 0; i < rows; i++) {
        for (let j = 0; j < cols; j++) {
          const normalized = (data[i][j] - min) / (max - min);
          const intensity = Math.floor(normalized * 255);

          if (colorScheme === 'Blues') {
            ctx.fillStyle = `rgb(${255 - intensity}, ${255 - intensity}, 255)`;
          } else {
            ctx.fillStyle = `rgb(${255 - intensity}, 255, ${255 - intensity})`;
          }

          ctx.fillRect(j * cellWidth, i * cellHeight, cellWidth, cellHeight);
        }
      }
    }

    // --- Init ---
    checkHealth();
    initLibrary();
  </script>
</body>

</html>
